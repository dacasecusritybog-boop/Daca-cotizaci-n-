name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar proyecto
        run: |
          if [ -f settings.gradle ]; then
            echo "PROJ=." >> $GITHUB_ENV
          else
            Z=$(find . -maxdepth 2 -iname '*.zip' | head -1)
            if [ -z "$Z" ]; then
              echo "No hay ningún .zip ni settings.gradle en el repositorio. Archivos:"
              ls -la
              exit 1
            fi
            echo "Usando: $Z"
            unzip -o "$Z" -d proyecto
            echo "PROJ=proyecto" >> $GITHUB_ENV
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Instalar plataforma Android 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK debug
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DACATECH-Cotizaciones-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
